name: 检查

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 签出代码
        uses: actions/checkout@v7

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: Lint、格式与类型检查
        run: bun run check

      - name: 构建站点
        run: bun run build
