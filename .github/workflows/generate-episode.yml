name: 生成播客剧集

on:
  schedule:
    # 北京时间每周二 07:30 = UTC 周一 23:30
    - cron: '30 23 * * 1'
  workflow_dispatch:
    inputs:
      date:
        description: '发布日 YYYY-MM-DD（留空则自动取最近一个周二）'
        required: false
        type: string
      force:
        description: '强制重新生成已存在的日期'
        required: false
        type: boolean
        default: false

concurrency:
  # 同一分支上的生成任务串行执行，避免并发提交互相覆盖
  group: generate-episode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 安装 FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: 生成播客剧集
        run: |
          ARGS=()
          if [ -n "${{ inputs.date }}" ]; then
            ARGS+=(--date "${{ inputs.date }}")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          bun run gen -- "${ARGS[@]}"
        env:
          SUPERLINKED_API_KEY: ${{ secrets.SUPERLINKED_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          CF_R2_PUBLIC_URL: ${{ secrets.CF_R2_PUBLIC_URL }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

      - name: 提交并推送新剧集
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/content/episodes/

          if git diff --cached --quiet; then
            echo "没有新剧集生成，跳过提交"
          else
            EPISODE_FILE=$(git diff --cached --name-only | head -1)
            git commit -m "🎙️ 自动生成新播客剧集: ${EPISODE_FILE}

          Co-authored-by: Craig Hart <i@craigary.net>"
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            git push origin "HEAD:${BRANCH}"
          fi
